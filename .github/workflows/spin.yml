name: spin-frames
on: workflow_dispatch
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract turning frames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          mkdir -p spin
          ffmpeg -y -ss 2.2 -t 1.2 -i carica-camden-grey-notte-aggancio.mp4 -vf "fps=24,scale=640:-1" spin/s_%02d.png
          ls spin | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: spin
          path: spin/*.png
