name: preview-shot
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emulator + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1920x720
          script: |
            echo "ffmpeg before: $(which ffmpeg || echo none)"
            sudo apt-get update -qq > /tmp/apt.log 2>&1; echo "apt update rc=$?"
            sudo apt-get install -y ffmpeg >> /tmp/apt.log 2>&1; echo "apt install rc=$?"
            tail -6 /tmp/apt.log || true
            echo "ffmpeg after: $(which ffmpeg || echo none)"
            adb shell settings put global hide_error_dialogs 1
            adb shell wm size 1920x720
            adb shell wm density 160
            sleep 25
            adb install -r build/preview.apk
            adb shell am start -n com.mg4.preview/.MainActivity
            sleep 10

            # night first (after the system has settled)
            adb shell cmd uimode night yes
            adb shell am force-stop com.mg4.preview
            adb shell am start -n com.mg4.preview/.MainActivity
            sleep 8
            (adb shell screenrecord --time-limit 6 /sdcard/v.mp4 &)
            sleep 1
            adb shell input tap 960 352
            sleep 6
            sleep 2
            adb pull /sdcard/v.mp4 v.mp4 || true
            ls -l v.mp4 || true
            mkdir -p frames
            ffmpeg -y -i v.mp4 -vf fps=10 frames/f_%02d.png 2>&1 | tail -6 || true
            ls frames | wc -l
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1
            sleep 1
            adb exec-out screencap -p > shot.png

            # day last
            adb shell cmd uimode night no
            adb shell am force-stop com.mg4.preview
            adb shell am start -n com.mg4.preview/.MainActivity
            sleep 8
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1
            sleep 1
            adb exec-out screencap -p > day.png
            ls -l *.png
      - uses: actions/upload-artifact@v4
        with:
          name: shot
          path: |
            *.png
            v.mp4
            frames/*.png
