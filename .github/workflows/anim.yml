name: ready-animation
on: workflow_dispatch
jobs:
  anim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emulator + recording
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1920x720
          script: |
            adb shell svc power stayon true
            sleep 20
            adb install -r launcher.apk
            adb shell am start -n com.mg4.launcher/.SpinDemoActivity
            sleep 6
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell screenrecord --time-limit 12 /sdcard/anim.mp4 || true
            sleep 2
            adb pull /sdcard/anim.mp4 anim.mp4 || true
            ls -l anim.mp4 || true
            adb exec-out screencap -p > final.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: anim
          path: |
            anim.mp4
            final.png
