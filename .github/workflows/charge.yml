name: charge-frames
on: workflow_dispatch
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p frames
          ffmpeg -y -i carica-camden-grey-giorno-aggancio.mp4 -vf fps=4 frames/f_%02d.png
          ffmpeg -y -i carica-camden-grey-giorno-loop.mp4 -vf fps=2 frames/loop_%02d.png
          ls frames | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames/*.png
